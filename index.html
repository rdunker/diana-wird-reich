<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Urlaubsgeld Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="background"></div>
    <div class="wrapper">
      <div id="message"></div>

      <div class="container">
        <h1 id="counter">0,00 €</h1>

        <label for="rate">Urlaubsgeld / Stunde</label>
        <input id="rate" type="number" step="0.01" value="70" />

        <div class="controls">
          <div class="buttons">
            <button id="start" class="btn start">Start</button>
            <button id="pause" class="btn pause">Pause</button>
            <button id="stop" class="btn stop">Stop</button>
          </div>

          <div class="background-control">
            <label for="backgroundSelect">Nächsten Urlaubsort auswählen</label>
          <select id="backgroundSelect">
            <option value="img/beach_world.jpg">Strand</option>
            <option value="img/winter_world.jpg">Winter</option>
            <option value="img/mexico_world.jpg">Mexico</option>
          </select>
          </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
